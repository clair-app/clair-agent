# Clair agent CI. Every job is a `make` target, so a red job reproduces locally with
# the same command and the same pinned tool versions (see the Makefile).
stages: [check, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # Keep the module cache and the ./bin tools between runs; both are keyed below.
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/build-cache"
  GOFLAGS: "-mod=readonly"
  GOTOOLCHAIN: "local"   # the image's Go is the Go; never auto-download another

.go:
  # The minor matches go.mod's `go` line; the image carries the newest patch.
  image: golang:1.26
  interruptible: true
  cache:
    - key:
        files: [go.sum, Makefile]
        prefix: go
      paths: [.go/pkg/mod/, .go/build-cache/, bin/]
  before_script:
    - go version
    - make tools

# No Go build needed, but the tool is Go: this only reads `.agents/memory/decisions/`.
# Enforced (not advisory) because a stale router silently hides a decision from every
# agent that reads it, and `merge=union` on the generated file means a bad merge lands
# quietly rather than as a conflict. `.githooks/pre-commit` runs the same check against
# the staged tree; this is the backstop.
adr-index:
  extends: .go
  stage: check
  before_script: []
  script: make adr-check

# CHANGELOG.md must stay a Level 2 Declarative Changelog with no warnings
# (https://whatsnew.fyi/spec). The validator is an npm package, so this job takes the Node
# image, which has make too, instead of the Go one.
changelog:
  stage: check
  image: node:24
  interruptible: true
  variables:
    npm_config_update_notifier: "false"
  script: make changelog-check

# Tidy go.mod/go.sum and gofumpt/goimports-clean sources; both are autocorrectable
# (`make tidy`, `make fmt`), so a red job here is a forgotten step, not a finding.
format:
  extends: .go
  stage: check
  script:
    - make tidy-check
    - make fmt-check

lint:
  extends: .go
  stage: check
  script: make lint

test:
  extends: .go
  stage: check
  script:
    - make test
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 2 weeks

# Advisory today (allow_failure) because a new CVE in a dependency should not block an
# unrelated merge; it should be seen. Flip to blocking once the agent handles keys.
vuln:
  extends: .go
  stage: check
  allow_failure: true
  script: make vuln

build:
  extends: .go
  stage: build
  before_script: []
  script:
    - make build
    - bin/clair version
    - make build-all
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

# A release tag (vX.Y.Z) runs dist → sign → signature:windows → release. Built here rather
# than taken from `build`'s artifacts so the version stamped in is the tag, which `make dist`
# checks.
.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

dist:
  extends: [.go, .release-tag]
  stage: release
  interruptible: false
  before_script: []
  # No earlier job's artifacts: `make dist` builds everything itself and refuses a checkout
  # any untracked file makes "modified".
  dependencies: []
  script: make dist VERSION="$CI_COMMIT_TAG"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Signs copies of the two Windows builds through Azure Artifact Signing, as Jeffrey Mixon
# (ADR 2026-09.6uv6), with jsign: a Java signer that speaks the service's API, so no Windows
# machine or signtool is needed. The certificates live three days, so every signature carries
# an RFC 3161 timestamp or it goes invalid in users' hands. AZURE_TENANT_ID, AZURE_CLIENT_ID and
# AZURE_CLIENT_SECRET (the signing app registration's), and SIGN_ALIAS (`<account>/<certificate
# profile>`), are protected variables scoped to the windows-signing environment: only this job,
# on a protected `v*` tag, can read them. The job hands on only signed/, and `release` checks
# each file against `dist`'s own build.
sign:
  extends: .release-tag
  stage: release
  image: eclipse-temurin:21-jre
  interruptible: false
  needs: [dist]
  environment:
    name: windows-signing
    action: prepare
  variables:
    JSIGN_VERSION: "7.5"
    JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
    SIGN_ENDPOINT: eus.codesigning.azure.net
  script:
    - |
      [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$SIGN_ALIAS" ] || {
        echo "sign: no AZURE_* or SIGN_ALIAS variables here; they reach only a protected v* tag (ADR 2026-09.6uv6)" >&2; exit 1; }
    - curl -fsSLo jsign.jar "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
    - echo "$JSIGN_SHA256  jsign.jar" | sha256sum -c
    - mkdir signed && cp dist/clair-windows-*.exe signed/
    # jsign 7.5 takes an access token, not the client secret (its online docs describe master), so
    # the job asks Entra ID for one. The token lives an hour and never reaches the log.
    - |
      JSIGN_TOKEN=$(curl -fsS "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
        --data-urlencode grant_type=client_credentials --data-urlencode "client_id=$AZURE_CLIENT_ID" \
        --data-urlencode "client_secret=$AZURE_CLIENT_SECRET" --data-urlencode scope=https://codesigning.azure.net/.default |
        sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
      [ -n "$JSIGN_TOKEN" ] || { echo "sign: Entra ID issued no access token" >&2; exit 1; }
      export JSIGN_TOKEN
      java -jar jsign.jar --storetype TRUSTEDSIGNING --keystore "$SIGN_ENDPOINT" --storepass env:JSIGN_TOKEN \
        --alias "$SIGN_ALIAS" --alg SHA-256 --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 \
        signed/clair-windows-*.exe
  artifacts:
    paths: [signed/]
    expire_in: 1 week

# Windows' own verdict on the signed builds, which `tools/authenticode` does not give: the
# chain to a root Windows trusts. Then the build for this runner must still run and report
# the tag.
signature:windows:
  extends: .release-tag
  stage: release
  tags: [windows]
  interruptible: false
  needs: [sign]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      $ErrorActionPreference = 'Stop'
      foreach ($f in Get-ChildItem 'signed\clair-windows-*.exe') {
        $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
        Write-Host "$($f.Name): $($s.Status); $($s.SignerCertificate.Subject); timestamped by $($s.TimeStamperCertificate.Subject)"
        if ($s.Status -ne 'Valid') { throw "$($f.Name): $($s.Status): $($s.StatusMessage)" }
        if ($s.SignerCertificate.Subject -notlike 'CN=Jeffrey Mixon,*') { throw "$($f.Name) is not signed by Jeffrey Mixon" }
        if (-not $s.TimeStamperCertificate) { throw "$($f.Name) is not timestamped" }
      }
      $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
      $said = & "signed\clair-windows-$arch.exe" version
      Write-Host $said
      if ($said -notlike "clair $env:CI_COMMIT_TAG *") { throw "clair-windows-$arch.exe reports '$said', not $env:CI_COMMIT_TAG" }

# Publishes the six builds and their SHA256SUMS.txt to this project's generic package registry,
# as packages/generic/clair/<tag>/<file>. claircode.app serves them to its installers once its
# agent-release.json pins their hashes (ADR 2026-09.zvs8); nothing reaches a user from here
# alone. The Windows builds are the signed ones, and the checksums are over their signed bytes.
# The registry keeps a re-uploaded file beside the old one; the site's pin catches a change.
release:
  extends: [.go, .release-tag]
  stage: release
  interruptible: false
  before_script: []
  needs: [dist, sign, "signature:windows"]
  script:
    - make dist-signed SIGNED=signed
    - |
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/clair/$CI_COMMIT_TAG"
      for f in dist/clair-* dist/SHA256SUMS.txt; do
        echo "  $base/${f#dist/}"
        curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" "$base/${f#dist/}"
        echo
      done
  artifacts:
    paths: [dist/]
    expire_in: 1 week


# Windows, on the instance runner tagged `windows`: a Windows 11 machine, shell executor, pwsh,
# running as SYSTEM in session 0. It has git, curl and tar but no Go, so the job fetches the
# Go 1.26 that go.dev names (its published SHA-256 checked) into the runner's own directory,
# where it survives `git clean` between jobs. Without a C compiler there is no race detector,
# so the tests run with -shuffle only; Linux's `test` job is the race gate.
#
# Then the self-update for real (ADR 2026-09.qk6v): a running clair.exe is renamed aside and
# replaced, a second update lands before the restart while the first aside copy is still the
# running image, a tampered or foreign-key release is refused, and after a restart the new
# binary runs and the sweep removes the aside copy. Session 0 has no desktop, so the Scheduled
# Task and presence halves of ADR 2026-09.ahq8 still wait for a signed-in user.
windows:
  stage: check
  tags: [windows]
  interruptible: true
  timeout: 30m
  variables:
    # A fresh clone: files a fetch leaves in place keep the line endings of an older
    # checkout, and the golden tests compare bytes.
    GIT_STRATEGY: clone
  rules:
    - changes: [cmd/**/*, internal/**/*, tools/**/*, go.mod, go.sum, .gitlab-ci.yml]
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      $tools = Join-Path $env:CI_BUILDS_DIR '.clair-tools'
      # The parentheses matter: Invoke-RestMethod hands a JSON array on as one object.
      $go = (Invoke-RestMethod 'https://go.dev/dl/?mode=json') | Where-Object { $_.stable -and $_.version -like 'go1.26.*' } | Select-Object -First 1
      if (-not $go) { throw 'go.dev lists no stable Go 1.26' }
      $root = Join-Path $tools $go.version
      if (-not (Test-Path "$root\go\bin\go.exe")) {
        $file = @($go.files | Where-Object { $_.os -eq 'windows' -and $_.arch -eq 'amd64' -and $_.kind -eq 'archive' })
        if ($file.Count -ne 1) { throw "go.dev lists $($file.Count) windows-amd64 archives of $($go.version)" }
        $file = $file[0]
        New-Item -ItemType Directory -Force $root | Out-Null
        $zip = Join-Path $tools $file.filename
        Invoke-WebRequest "https://go.dev/dl/$($file.filename)" -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $file.sha256) { throw "$($file.filename) does not match go.dev's SHA-256" }
        tar -xf $zip -C $root
        if ($LASTEXITCODE) { throw "unpacking $($file.filename) failed" }
        Remove-Item $zip
      }
      $env:PATH = "$root\go\bin;$env:PATH"
      $env:GOMODCACHE = Join-Path $tools 'gomod'
      $env:GOCACHE = Join-Path $tools 'gocache'
      $env:CGO_ENABLED = '0'
      go version
  script:
    - go test -shuffle=on -count=1 ./...
    # The runner is a machine people use too, so the job's daemon and release server take
    # ports nothing else here does (a real agent listens on 7317).
    - |
      $ErrorActionPreference = 'Stop'
      function Check($ok, $what) { if (-not $ok) { throw "failed: $what" } else { Write-Host "ok: $what" } }
      function Clair { $o = & $clair @args 2>&1 | Out-String; $code = $LASTEXITCODE; Write-Host "> clair $args (exit $code)`n$o"; [pscustomobject]@{ Code = $code; Out = $o } }
      function Latest($v) { [IO.File]::WriteAllText("$rel\latest.txt", "$v`n") }
      function Asides { @(Get-ChildItem $dest -Filter '.clair-old-*.exe' -Force) }
      function Start-Daemon { Start-Process -FilePath $clair -ArgumentList 'daemon', '-listen', '127.0.0.1:17417', '-log-file', "$work\daemon.log" -PassThru -NoNewWindow }
      function Wait-Answering { foreach ($i in 1..80) { & $clair status *> $null; if ($LASTEXITCODE -eq 0) { return }; Start-Sleep -Milliseconds 250 }; throw 'the daemon never answered' }

      $work = Join-Path $env:CI_PROJECT_DIR 'self-update'
      $rel = "$work\releases"; $dest = "$work\bin"; $src = 'http://127.0.0.1:18001'
      New-Item -ItemType Directory -Force $rel, $dest | Out-Null
      $env:CLAIR_CONFIG_DIR = "$work\config"; $env:CLAUDE_CONFIG_DIR = "$work\claude"
      go build -o "$work\releasesign.exe" ./tools/releasesign
      $pub = (& "$work\releasesign.exe" keygen -out "$work\test.pem" | Out-String).Trim()
      & "$work\releasesign.exe" keygen -out "$work\foreign.pem" | Out-Null
      foreach ($v in 'v0.0.1', 'v0.0.2', 'v0.0.3', 'v0.0.4', 'v0.0.5', 'v0.0.6') {
        $dir = "$rel\$v"; $name = "clair-$v-windows-amd64.exe"
        New-Item -ItemType Directory -Force $dir | Out-Null
        go build -trimpath -ldflags "-s -w -X main.version=$v -X main.releaseTestKey=$pub" -o "$dir\$name" ./cmd/clair
        if ($LASTEXITCODE) { throw "build $v" }
        $sum = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$dir\SHA256SUMS.txt", "$sum  $name`n")
        $signer = if ($v -eq 'v0.0.5') { "$work\foreign.pem" } else { "$work\test.pem" }
        & "$work\releasesign.exe" sign -key $signer $dir
        if ($LASTEXITCODE) { throw "sign $v" }
      }
      [IO.File]::AppendAllText("$rel\v0.0.4\clair-v0.0.4-windows-amd64.exe", 'x')  # no longer the signed bytes
      Latest 'v0.0.1'
      $server = Start-Process -FilePath "$work\releasesign.exe" -ArgumentList 'serve', '-listen', '127.0.0.1:18001', $rel -PassThru -NoNewWindow
      foreach ($i in 1..40) { curl.exe -fsS "$src/latest.txt" *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Milliseconds 250 }

      Copy-Item "$rel\v0.0.1\clair-v0.0.1-windows-amd64.exe" "$dest\clair.exe"
      $clair = "$dest\clair.exe"
      $daemon = Start-Daemon
      Wait-Answering
      try { Write-Host ("Defender real-time protection: " + (Get-MpComputerStatus).RealTimeProtectionEnabled) } catch { Write-Host "Defender status unavailable: $_" }

      $r = Clair update -check -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'clair v0\.0\.1 is the latest release') 'v0.0.1 is the latest'

      Latest 'v0.0.2'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.2') 'the running daemon staged v0.0.2'
      Check ((Clair version).Out -match '^clair v0\.0\.2 ') 'clair.exe is now v0.0.2'
      Check (-not $daemon.HasExited) 'the daemon kept running'
      Check ((Asides).Count -eq 1) 'the running v0.0.1 was renamed aside'
      Write-Host ('daemon image: ' + (Get-Process -Id $daemon.Id).Path)
      Check ((Clair status).Out -match 'updates: clair v0\.0\.2 is installed') 'status says v0.0.2 waits for a restart'

      # A second update before the restart: v0.0.1 still runs from its aside copy.
      Latest 'v0.0.3'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.3') 'a second update staged v0.0.3'
      Check ((Clair version).Out -match '^clair v0\.0\.3 ') 'clair.exe is now v0.0.3'
      # v0.0.1 runs the daemon; v0.0.2 was the `clair update` that asked, running as it was
      # moved aside, so Windows keeps it too until the sweep at the next start.
      Check ((Asides).Count -eq 2) 'both running images are left aside'
      Check (-not $daemon.HasExited) 'the daemon still runs'

      Latest 'v0.0.4'
      $r = Clair update -releases $src
      Check ($r.Code -ne 0 -and $r.Out -match 'not the signed') 'a tampered build is refused'
      Latest 'v0.0.5'
      $r = Clair update -releases $src
      Check ($r.Code -ne 0 -and $r.Out -match 'bad release signature') 'a foreign key is refused'
      Check ((Clair version).Out -match '^clair v0\.0\.3 ') 'clair.exe is still v0.0.3'
      Check ((Get-ChildItem $dest -Filter '.clair-update-*' -Force).Count -eq 0) 'no download is left behind'

      # A clean stop through the control surface, then the next start runs v0.0.3 and sweeps.
      $admin = (Get-Content "$env:CLAIR_CONFIG_DIR\agent.json" -Raw | ConvertFrom-Json).adminToken
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:17417/clair/ctl/stop
      Check ($daemon.WaitForExit(15000)) 'the daemon stopped'
      $daemon = Start-Daemon
      Wait-Answering
      $st = (Clair status -json).Out | ConvertFrom-Json
      Check ($st.version -eq 'v0.0.3') 'after the restart the daemon runs v0.0.3'
      Check ((Asides).Count -eq 0) 'the sweep removed the aside copy'
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:17417/clair/ctl/stop
      $daemon.WaitForExit(15000) | Out-Null

      # The scheduled task's shape (ADR 2026-09.pz5g): conhost --headless running
      # `clair daemon -supervise`. A killed daemon comes back, on the release the self-update
      # staged; a clean stop ends the supervisor and conhost with exit 0.
      function Child { Get-CimInstance Win32_Process -Filter "Name='clair.exe'" | Where-Object CommandLine -match '-listen=127\.0\.0\.1:17417' }
      $sup = Start-Process -FilePath "$env:SystemRoot\System32\conhost.exe" -ArgumentList '--headless', "`"$clair`"", 'daemon', '-supervise', '-listen', '127.0.0.1:17417', '-log-file', "`"$work\supervised.log`"" -PassThru
      Wait-Answering
      $first = (Child).ProcessId
      Check ($first) 'the supervisor started the daemon'
      Latest 'v0.0.6'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.6') 'v0.0.6 staged under the supervisor'
      Stop-Process -Id $first -Force
      foreach ($i in 1..80) { $c = Child; if ($c -and $c.ProcessId -ne $first) { break }; Start-Sleep -Milliseconds 250 }
      Wait-Answering
      $st = (Clair status -json).Out | ConvertFrom-Json
      Check ($st.version -eq 'v0.0.6') 'the killed daemon came back, on the staged release'
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:17417/clair/ctl/stop
      Check ($sup.WaitForExit(20000)) 'a clean stop ended the supervisor and conhost'
      Check ($sup.ExitCode -eq 0) 'conhost exited 0'
      Check (-not (Child)) 'no daemon is left'
      Get-Content "$work\supervised.log" | Select-String 'starting it again|stopped cleanly'
      Stop-Process -Id $server.Id -Force
  after_script:
    # A process left running would hold files the next job's `git clean` must delete.
    - |
      $root = (Resolve-Path $env:CI_PROJECT_DIR).Path
      Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
      Get-Content "$root\self-update\daemon.log" -ErrorAction SilentlyContinue | Select-Object -Last 40

# macOS, on the instance runner tagged `macos`: a Mac mini (Apple M6, macOS 27), shell executor,
# bash, run by the Mac's own user inside its GUI login (ADR 2026-09.tbsh). So gui/<uid> is a live
# launchd domain, and the job drives the LaunchAgent for real (ADR 2026-09.ahq8):
#
# - `make test` on darwin, with the race detector (Xcode's clang is there).
# - codesign and tools/machocheck agree on the build's signature.
# - install, pair through tools/relaysim and tools/phonesim, answer a decide, presence from a
#   keystroke read at a pty, SIGKILL and see KeepAlive restart it, stop it through
#   /clair/ctl/stop and see it stay down, uninstall.
# - claircode.app's install.sh under /bin/sh against a release of this commit on 127.0.0.1: a
#   first install with no config, an upgrade over the running service, a shell under Rosetta.
# - the self-update (ADR 2026-09.qk6v) with a key made for the run: a running LaunchAgent's
#   binary replaced, codesign-valid and unquarantined, a restart onto it, a tampered and a
#   foreign-key release refused.
#
# The Mac is also someone's machine. There is one LaunchAgent label per user, so the job refuses
# to run while a real clair agent is installed there, and it keeps its own daemon, relay and
# release servers off the ports a real agent uses — except install.sh's first install, which is a
# user's first install and so takes 127.0.0.1:7317. Each install shows "Background Items Added"
# on the Mac's screen. Go and its caches persist under $CI_BUILDS_DIR/.clair-tools. The runner's
# PATH is launchd's, so Homebrew's bin is added for jq.
macos:
  stage: check
  tags: [macos]
  interruptible: true
  timeout: 20m
  resource_group: mac-mini   # one LaunchAgent label, fixed ports
  variables:
    LABEL: app.claircode.clair
    HOOK: http://127.0.0.1:17317
    RELAY: http://127.0.0.1:13000
  rules:
    - changes: [cmd/**/*, internal/**/*, tools/**/*, go.mod, go.sum, Makefile, .gitlab-ci.yml]
  before_script:
    - |
      export PATH="/opt/homebrew/bin:$PATH"
      command -v jq > /dev/null || { echo "macos: no jq on this Mac (brew install jq)"; exit 1; }
      [ "$(uname -m)" = arm64 ] || { echo "macos: the job fetches Go for arm64, and this is $(uname -m)"; exit 1; }
      tools="$CI_BUILDS_DIR/.clair-tools"
      dl=$(curl -fsS 'https://go.dev/dl/?mode=json')
      go=$(jq -r '[.[] | select(.stable and (.version | startswith("go1.26.")))][0].version // empty' <<< "$dl")
      [ -n "$go" ] || { echo "macos: go.dev lists no stable Go 1.26"; exit 1; }
      if [ ! -x "$tools/$go/go/bin/go" ]; then
        file="$go.darwin-arm64.tar.gz"
        sum=$(jq -r --arg f "$file" '.[].files[] | select(.filename == $f) | .sha256' <<< "$dl")
        mkdir -p "$tools"
        curl -fsSLo "$tools/$file" "https://go.dev/dl/$file"
        echo "$sum  $tools/$file" | shasum -a 256 -c
        rm -rf "$tools/$go.part" && mkdir "$tools/$go.part"
        tar -xzf "$tools/$file" -C "$tools/$go.part"
        mv "$tools/$go.part" "$tools/$go"
        rm "$tools/$file"
      fi
      export PATH="$tools/$go/go/bin:$PATH" GOPATH="$tools/gopath" GOMODCACHE="$tools/gomod" GOCACHE="$tools/gocache"
      go version
    - |
      plist="$HOME/Library/LaunchAgents/$LABEL.plist"
      if [ -e "$plist" ]; then
        prog=$(plutil -extract ProgramArguments.0 raw -o - "$plist")
        case "$prog" in
        "$CI_BUILDS_DIR"/*) echo "macos: removing the LaunchAgent a cancelled run left"; launchctl bootout "gui/$(id -u)/$LABEL" 2> /dev/null || true; rm -f "$plist" ;;
        *) echo "macos: $plist runs $prog, a real clair agent, which this job would replace"; exit 1 ;;
        esac
      fi
      for port in 7317 13000 17317 18000 18001; do
        if nc -z 127.0.0.1 "$port" 2> /dev/null; then echo "macos: something already listens on 127.0.0.1:$port"; exit 1; fi
      done
  script:
    - make test
    # codesign is Apple's own verifier: where it and tools/machocheck disagree, the checker that
    # guards the Linux-built releases is wrong.
    - |
      make build
      bin/clair version
      codesign --verify --strict --verbose=2 bin/clair
      go run ./tools/machocheck bin/clair
      for t in relaysim phonesim releasesign; do go build -o "bin/$t" "./tools/$t"; done
    - |
      W="$CI_PROJECT_DIR/.mac"
      B="$CI_PROJECT_DIR/bin" # what runs in the background runs by this path, which after_script kills
      mkdir -p "$W/logs"
      export CLAIR_CONFIG_DIR="$W/clair" CLAUDE_CONFIG_DIR="$W/claude"
      TARGET="gui/$(id -u)/$LABEL"
      # Readers that stop early would SIGPIPE launchctl, and pipefail is on.
      pid() { launchctl print "$TARGET" | awk '$1 == "pid" && !seen { print $3; seen = 1 }'; }
      answering() { for _ in $(seq 40); do "$1" status > /dev/null 2>&1 && return 0; sleep 0.25; done; return 1; }
      listening() { for _ in $(seq 40); do nc -z 127.0.0.1 "$1" 2> /dev/null && return 0; sleep 0.25; done; return 1; }
      decide() {
        curl -sS --fail-with-body -X POST -H "Authorization: Bearer $(jq -r .token "$CLAIR_CONFIG_DIR/agent.json")" \
          --data '{"session_id":"ci","hook_event_name":"PermissionRequest","tool_name":"Bash","tool_input":{"command":"ls"}}' \
          "$HOOK/clair/v1/hook/decide?timeout=30"
      }
      nohup "$B/relaysim" -listen 127.0.0.1:13000 > "$W/logs/relaysim.log" 2>&1 &
      listening 13000 || { cat "$W/logs/relaysim.log"; exit 1; }
    # The relay and the loopback live in agent.json, which `clair daemon -relay -listen` writes.
    - |
      "$B/clair" daemon -listen 127.0.0.1:17317 -relay "$RELAY" > "$W/logs/daemon-once.log" 2>&1 &
      once=$!
      answering bin/clair || { cat "$W/logs/daemon-once.log"; exit 1; }
      kill "$once"
      wait "$once" || true
      jq -e --arg r "$RELAY" '.relay == $r and .listen == "127.0.0.1:17317"' "$CLAIR_CONFIG_DIR/agent.json"
    - |
      echo "--- install the LaunchAgent"
      bin/clair service install
      bin/clair service status
      launchctl print "$TARGET" | sed -n 1,40p
      sudo -n sfltool dumpbtm 2> /dev/null | grep -B2 -A9 'Name: clair$' || echo "(no Background Items entry named clair yet; informational)"
    - |
      echo "--- pair through phonesim"
      "$B/clair" pair -qr none > "$W/logs/pair.log" 2>&1 &
      pair=$!
      link=
      for _ in $(seq 40); do
        link=$(grep -oE 'http://127\.0\.0\.1:13000/p#[A-Za-z0-9_-]+' "$W/logs/pair.log" | head -1) || true
        [ -n "$link" ] && break
        sleep 0.25
      done
      [ -n "$link" ] || { cat "$W/logs/pair.log"; exit 1; }
      nohup "$B/phonesim" -v "$link" > "$W/logs/phonesim.log" 2>&1 &
      for _ in $(seq 120); do kill -0 "$pair" 2> /dev/null || break; sleep 0.25; done
      if kill -0 "$pair" 2> /dev/null; then echo "clair pair did not finish"; cat "$W/logs/pair.log"; exit 1; fi
      wait "$pair"
      cat "$W/logs/pair.log"
      bin/clair status
    - |
      echo "--- the phone answers a decide"
      out=$(decide)
      echo "$out"
      jq -e '.hookSpecificOutput.decision.behavior == "allow"' <<< "$out"
    # A keystroke read at a pty of this user's is presence (ADR 2026-09.34qh); script(1) makes the
    # pty, and the daemon, under launchd, must see it within a second or two.
    - |
      echo "--- presence from a keystroke read at a pty"
      printf 'x\n' | script -q /dev/null sh -c "read l; bin/clair status -json > '$W/presence.json'" > /dev/null
      jq '.presence' "$W/presence.json"
      jq -e '.presence.source == "pty" and .presence.idleMs < 3000' "$W/presence.json"
    - |
      echo "--- KeepAlive restarts a killed daemon, which picks its pair up again"
      before=$(pid)
      launchctl kill SIGKILL "$TARGET"
      after=
      for _ in $(seq 120); do
        after=$(pid)
        [ -n "$after" ] && [ "$after" != "$before" ] && break
        sleep 0.25
      done
      echo "pid $before, then ${after:-none}"
      [ -n "$after" ] && [ "$after" != "$before" ]
      answering bin/clair
      jq -e '.hookSpecificOutput.decision.behavior == "allow"' <<< "$(decide)"
    # SuccessfulExit false: a clean exit is not a failure, so nothing restarts it.
    - |
      echo "--- a daemon stopped through /clair/ctl/stop stays down"
      curl -sS --fail-with-body -X POST -H "Authorization: Bearer $(jq -r .adminToken "$CLAIR_CONFIG_DIR/agent.json")" "$HOOK/clair/ctl/stop"
      sleep 15 # past ThrottleInterval, when launchd would have restarted a failure
      launchctl print "$TARGET" | grep -E 'state =|last exit code ='
      launchctl print "$TARGET" | grep 'state = not running' > /dev/null
      if bin/clair status; then echo "the daemon is still answering"; exit 1; fi
      code=0
      bin/clair service status || code=$?
      [ "$code" -eq 3 ] # exitUnreachable: installed and loaded, and nothing answers
      bin/clair service uninstall
      test ! -e "$HOME/Library/LaunchAgents/$LABEL.plist"
      if launchctl print "$TARGET" > /dev/null 2>&1; then echo "still loaded"; exit 1; fi
    # Published names carry the version, as scripts/agent-release.mjs in clair-web stages them. The
    # first install has no config directory yet, as on a new Mac: it must say the service runs.
    - |
      echo "--- install.sh from claircode.app, against this commit's build"
      v=v0.0.0-ci
      rel="$W/releases"
      mkdir -p "$rel/$v"
      echo "$v" > "$rel/latest.txt"
      for arch in arm64 amd64; do
        CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "$rel/$v/clair-$v-darwin-$arch" ./cmd/clair
      done
      (cd "$rel/$v" && shasum -a 256 clair-* > SHA256SUMS.txt)
      nohup "$B/releasesign" serve -listen 127.0.0.1:18000 "$rel" > "$W/logs/releases.log" 2>&1 &
      listening 18000 || { cat "$W/logs/releases.log"; exit 1; }
      curl -fsSL https://claircode.app/install.sh -o "$W/install.sh"
      (
        export CLAIR_RELEASES_URL=http://127.0.0.1:18000 CLAIR_INSTALL_DIR="$W/install" CLAIR_CONFIG_DIR="$W/clair-new"
        installs() { out=$("$@" 2>&1); echo "$out"; grep -q 'The clair service is running' <<< "$out"; }
        echo "--- a first install"
        installs /bin/sh "$W/install.sh"
        echo "--- an upgrade over the running service"
        installs /bin/sh "$W/install.sh" "$v"
        echo "--- a shell under Rosetta, which must still install the arm64 build"
        arch -x86_64 /usr/bin/true
        installs arch -x86_64 /bin/sh "$W/install.sh"
        file "$CLAIR_INSTALL_DIR/clair" | grep -q arm64
        "$CLAIR_INSTALL_DIR/clair" service uninstall
      )
    # Builds that trust a key made for this run (RELEASE_TEST_KEY), served on 127.0.0.1 the way
    # claircode.app lays releases out; the key never leaves the checkout.
    - |
      echo "--- the LaunchAgent updates itself from a signed release"
      rel="$W/self-update"
      src=http://127.0.0.1:18001
      arch=$(go env GOARCH)
      key="$W/release-test.pem"
      pub=$(bin/releasesign keygen -out "$key")
      bin/releasesign keygen -out "$W/foreign.pem" > /dev/null
      for v in v0.0.1 v0.0.2 v0.0.3 v0.0.4; do
        make build VERSION=$v RELEASE_TEST_KEY="$pub"
        mkdir -p "$rel/$v"
        cp bin/clair "$rel/$v/clair-$v-darwin-$arch"
        (cd "$rel/$v" && shasum -a 256 clair-* > SHA256SUMS.txt)
        signer="$key"
        [ "$v" = v0.0.4 ] && signer="$W/foreign.pem"
        bin/releasesign sign -key "$signer" "$rel/$v"
      done
      printf x >> "$rel/v0.0.3/clair-v0.0.3-darwin-$arch" # no longer the signed bytes
      echo v0.0.1 > "$rel/latest.txt"
      nohup "$B/releasesign" serve -listen 127.0.0.1:18001 "$rel" > "$W/logs/self-update-releases.log" 2>&1 &
      listening 18001 || { cat "$W/logs/self-update-releases.log"; exit 1; }

      dest="$W/self-update-bin"
      mkdir -p "$dest"
      cp "$rel/v0.0.1/clair-v0.0.1-darwin-$arch" "$dest/clair"
      clair="$dest/clair"
      "$clair" service install
      out=$("$clair" update -check -releases "$src")
      echo "$out"
      grep -q "clair v0.0.1 is the latest release" <<< "$out"

      echo v0.0.2 > "$rel/latest.txt"
      before=$(pid)
      "$clair" update -releases "$src"
      "$clair" version | grep -q '^clair v0.0.2 '
      codesign --verify --strict --verbose=2 "$clair"
      go run ./tools/machocheck "$clair"
      if xattr "$clair" | grep -q com.apple.quarantine; then echo "the new binary is quarantined"; exit 1; fi
      [ "$(pid)" = "$before" ] # still the old daemon, on its old image
      out=$("$clair" status)
      echo "$out"
      grep -q "updates: clair v0.0.2 is installed" <<< "$out"

      "$clair" service restart
      "$clair" status -json | jq -e '.version == "v0.0.2"'

      for v in v0.0.3 v0.0.4; do
        echo "$v" > "$rel/latest.txt"
        if "$clair" update -releases "$src"; then echo "$v was installed"; exit 1; fi
        "$clair" version | grep -q '^clair v0.0.2 '
      done
      "$clair" service uninstall
  after_script:
    # Nothing of the job's may outlive it: its LaunchAgent, its servers, its log directory.
    - |
      plist="$HOME/Library/LaunchAgents/$LABEL.plist"
      if [ -e "$plist" ]; then
        case "$(plutil -extract ProgramArguments.0 raw -o - "$plist")" in
        "$CI_PROJECT_DIR"/*) launchctl bootout "gui/$(id -u)/$LABEL" 2> /dev/null || true; rm -f "$plist" ;;
        esac
      fi
      pkill -f "^$CI_PROJECT_DIR/(bin|\.mac)/" || true
      if [ ! -e "$plist" ] && [ -d "$HOME/Library/Logs/clair" ]; then
        mkdir -p "$CI_PROJECT_DIR/.mac/logs"
        tail -40 "$HOME/Library/Logs/clair/daemon.log" || true
        mv "$HOME/Library/Logs/clair" "$CI_PROJECT_DIR/.mac/logs/launchd"
      fi
  artifacts:
    when: always
    paths: [.mac/logs/]
    expire_in: 2 weeks
