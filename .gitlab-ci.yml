# Clair agent CI. Every job is a `make` target, so a red job reproduces locally with
# the same command and the same pinned tool versions (see the Makefile).
stages: [check, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # Keep the module cache and the ./bin tools between runs; both are keyed below.
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/build-cache"
  GOFLAGS: "-mod=readonly"
  GOTOOLCHAIN: "local"   # the image's Go is the Go; never auto-download another

.go:
  # The minor matches go.mod's `go` line; the image carries the newest patch.
  image: golang:1.26
  interruptible: true
  cache:
    - key:
        files: [go.sum, Makefile]
        prefix: go
      paths: [.go/pkg/mod/, .go/build-cache/, bin/]
  before_script:
    - go version
    - make tools

# No Go build needed, but the tool is Go: this only reads `.agents/memory/decisions/`.
# Enforced (not advisory) because a stale router silently hides a decision from every
# agent that reads it, and `merge=union` on the generated file means a bad merge lands
# quietly rather than as a conflict. `.githooks/pre-commit` runs the same check against
# the staged tree; this is the backstop.
adr-index:
  extends: .go
  stage: check
  before_script: []
  script: make adr-check

# Tidy go.mod/go.sum and gofumpt/goimports-clean sources; both are autocorrectable
# (`make tidy`, `make fmt`), so a red job here is a forgotten step, not a finding.
format:
  extends: .go
  stage: check
  script:
    - make tidy-check
    - make fmt-check

lint:
  extends: .go
  stage: check
  script: make lint

test:
  extends: .go
  stage: check
  script:
    - make test
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 2 weeks

# Advisory today (allow_failure) because a new CVE in a dependency should not block an
# unrelated merge; it should be seen. Flip to blocking once the agent handles keys.
vuln:
  extends: .go
  stage: check
  allow_failure: true
  script: make vuln

build:
  extends: .go
  stage: build
  before_script: []
  script:
    - make build
    - bin/clair version
    - make build-all
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

# A release tag (vX.Y.Z) publishes the six builds and their SHA256SUMS.txt to this
# project's generic package registry, as packages/generic/clair/<tag>/<file>. claircode.app
# serves them to its installers once its agent-release.json pins their hashes
# (ADR 2026-09.zvs8); nothing reaches a user from here alone. Built here rather than taken
# from `build`'s artifacts so the version stamped in is the tag, which `make dist` checks.
# The registry keeps a re-uploaded file beside the old one; the site's pin catches a change.
release:
  extends: .go
  stage: release
  interruptible: false
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
  script:
    - make dist VERSION="$CI_COMMIT_TAG"
    - |
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/clair/$CI_COMMIT_TAG"
      for f in dist/clair-* dist/SHA256SUMS.txt; do
        echo "  $base/${f#dist/}"
        curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" "$base/${f#dist/}"
        echo
      done
  artifacts:
    paths: [dist/]
    expire_in: 1 week


# Windows, on the instance runner tagged `windows`: a Windows 11 machine, shell executor, pwsh,
# running as SYSTEM in session 0. It has git, curl and tar but no Go, so the job fetches the
# Go 1.26 that go.dev names (its published SHA-256 checked) into the runner's own directory,
# where it survives `git clean` between jobs. Without a C compiler there is no race detector,
# so the tests run with -shuffle only; Linux's `test` job is the race gate.
#
# Then the self-update for real (ADR 2026-09.qk6v): a running clair.exe is renamed aside and
# replaced, a second update lands before the restart while the first aside copy is still the
# running image, a tampered or foreign-key release is refused, and after a restart the new
# binary runs and the sweep removes the aside copy. Session 0 has no desktop, so the Scheduled
# Task and presence halves of ADR 2026-09.ahq8 still wait for a signed-in user.
windows:
  stage: check
  tags: [windows]
  interruptible: true
  timeout: 30m
  variables:
    # A fresh clone: files a fetch leaves in place keep the line endings of an older
    # checkout, and the golden tests compare bytes.
    GIT_STRATEGY: clone
  rules:
    - changes: [cmd/**/*, internal/**/*, tools/**/*, go.mod, go.sum, .gitlab-ci.yml]
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      $tools = Join-Path $env:CI_BUILDS_DIR '.clair-tools'
      # The parentheses matter: Invoke-RestMethod hands a JSON array on as one object.
      $go = (Invoke-RestMethod 'https://go.dev/dl/?mode=json') | Where-Object { $_.stable -and $_.version -like 'go1.26.*' } | Select-Object -First 1
      if (-not $go) { throw 'go.dev lists no stable Go 1.26' }
      $root = Join-Path $tools $go.version
      if (-not (Test-Path "$root\go\bin\go.exe")) {
        $file = @($go.files | Where-Object { $_.os -eq 'windows' -and $_.arch -eq 'amd64' -and $_.kind -eq 'archive' })
        if ($file.Count -ne 1) { throw "go.dev lists $($file.Count) windows-amd64 archives of $($go.version)" }
        $file = $file[0]
        New-Item -ItemType Directory -Force $root | Out-Null
        $zip = Join-Path $tools $file.filename
        Invoke-WebRequest "https://go.dev/dl/$($file.filename)" -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $file.sha256) { throw "$($file.filename) does not match go.dev's SHA-256" }
        tar -xf $zip -C $root
        if ($LASTEXITCODE) { throw "unpacking $($file.filename) failed" }
        Remove-Item $zip
      }
      $env:PATH = "$root\go\bin;$env:PATH"
      $env:GOMODCACHE = Join-Path $tools 'gomod'
      $env:GOCACHE = Join-Path $tools 'gocache'
      $env:CGO_ENABLED = '0'
      go version
  script:
    - go test -shuffle=on -count=1 ./...
    - |
      $ErrorActionPreference = 'Stop'
      function Check($ok, $what) { if (-not $ok) { throw "failed: $what" } else { Write-Host "ok: $what" } }
      function Clair { $o = & $clair @args 2>&1 | Out-String; $code = $LASTEXITCODE; Write-Host "> clair $args (exit $code)`n$o"; [pscustomobject]@{ Code = $code; Out = $o } }
      function Latest($v) { [IO.File]::WriteAllText("$rel\latest.txt", "$v`n") }
      function Asides { @(Get-ChildItem $dest -Filter '.clair-old-*.exe' -Force) }
      function Start-Daemon { Start-Process -FilePath $clair -ArgumentList 'daemon', '-listen', '127.0.0.1:7417', '-log-file', "$work\daemon.log" -PassThru -NoNewWindow }
      function Wait-Answering { foreach ($i in 1..80) { & $clair status *> $null; if ($LASTEXITCODE -eq 0) { return }; Start-Sleep -Milliseconds 250 }; throw 'the daemon never answered' }

      $work = Join-Path $env:CI_PROJECT_DIR 'self-update'
      $rel = "$work\releases"; $dest = "$work\bin"; $src = 'http://127.0.0.1:8001'
      New-Item -ItemType Directory -Force $rel, $dest | Out-Null
      $env:CLAIR_CONFIG_DIR = "$work\config"; $env:CLAUDE_CONFIG_DIR = "$work\claude"
      go build -o "$work\releasesign.exe" ./tools/releasesign
      $pub = (& "$work\releasesign.exe" keygen -out "$work\test.pem" | Out-String).Trim()
      & "$work\releasesign.exe" keygen -out "$work\foreign.pem" | Out-Null
      foreach ($v in 'v0.0.1', 'v0.0.2', 'v0.0.3', 'v0.0.4', 'v0.0.5', 'v0.0.6') {
        $dir = "$rel\$v"; $name = "clair-$v-windows-amd64.exe"
        New-Item -ItemType Directory -Force $dir | Out-Null
        go build -trimpath -ldflags "-s -w -X main.version=$v -X main.releaseTestKey=$pub" -o "$dir\$name" ./cmd/clair
        if ($LASTEXITCODE) { throw "build $v" }
        $sum = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$dir\SHA256SUMS.txt", "$sum  $name`n")
        $signer = if ($v -eq 'v0.0.5') { "$work\foreign.pem" } else { "$work\test.pem" }
        & "$work\releasesign.exe" sign -key $signer $dir
        if ($LASTEXITCODE) { throw "sign $v" }
      }
      [IO.File]::AppendAllText("$rel\v0.0.4\clair-v0.0.4-windows-amd64.exe", 'x')  # no longer the signed bytes
      Latest 'v0.0.1'
      $server = Start-Process -FilePath "$work\releasesign.exe" -ArgumentList 'serve', '-listen', '127.0.0.1:8001', $rel -PassThru -NoNewWindow
      foreach ($i in 1..40) { curl.exe -fsS "$src/latest.txt" *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Milliseconds 250 }

      Copy-Item "$rel\v0.0.1\clair-v0.0.1-windows-amd64.exe" "$dest\clair.exe"
      $clair = "$dest\clair.exe"
      $daemon = Start-Daemon
      Wait-Answering
      try { Write-Host ("Defender real-time protection: " + (Get-MpComputerStatus).RealTimeProtectionEnabled) } catch { Write-Host "Defender status unavailable: $_" }

      $r = Clair update -check -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'clair v0\.0\.1 is the latest release') 'v0.0.1 is the latest'

      Latest 'v0.0.2'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.2') 'the running daemon staged v0.0.2'
      Check ((Clair version).Out -match '^clair v0\.0\.2 ') 'clair.exe is now v0.0.2'
      Check (-not $daemon.HasExited) 'the daemon kept running'
      Check ((Asides).Count -eq 1) 'the running v0.0.1 was renamed aside'
      Write-Host ('daemon image: ' + (Get-Process -Id $daemon.Id).Path)
      Check ((Clair status).Out -match 'updates: clair v0\.0\.2 is installed') 'status says v0.0.2 waits for a restart'

      # A second update before the restart: v0.0.1 still runs from its aside copy.
      Latest 'v0.0.3'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.3') 'a second update staged v0.0.3'
      Check ((Clair version).Out -match '^clair v0\.0\.3 ') 'clair.exe is now v0.0.3'
      # v0.0.1 runs the daemon; v0.0.2 was the `clair update` that asked, running as it was
      # moved aside, so Windows keeps it too until the sweep at the next start.
      Check ((Asides).Count -eq 2) 'both running images are left aside'
      Check (-not $daemon.HasExited) 'the daemon still runs'

      Latest 'v0.0.4'
      $r = Clair update -releases $src
      Check ($r.Code -ne 0 -and $r.Out -match 'not the signed') 'a tampered build is refused'
      Latest 'v0.0.5'
      $r = Clair update -releases $src
      Check ($r.Code -ne 0 -and $r.Out -match 'bad release signature') 'a foreign key is refused'
      Check ((Clair version).Out -match '^clair v0\.0\.3 ') 'clair.exe is still v0.0.3'
      Check ((Get-ChildItem $dest -Filter '.clair-update-*' -Force).Count -eq 0) 'no download is left behind'

      # A clean stop through the control surface, then the next start runs v0.0.3 and sweeps.
      $admin = (Get-Content "$env:CLAIR_CONFIG_DIR\agent.json" -Raw | ConvertFrom-Json).adminToken
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:7417/clair/ctl/stop
      Check ($daemon.WaitForExit(15000)) 'the daemon stopped'
      $daemon = Start-Daemon
      Wait-Answering
      $st = (Clair status -json).Out | ConvertFrom-Json
      Check ($st.version -eq 'v0.0.3') 'after the restart the daemon runs v0.0.3'
      Check ((Asides).Count -eq 0) 'the sweep removed the aside copy'
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:7417/clair/ctl/stop
      $daemon.WaitForExit(15000) | Out-Null

      # The scheduled task's shape (ADR 2026-09.pz5g): conhost --headless running
      # `clair daemon -supervise`. A killed daemon comes back, on the release the self-update
      # staged; a clean stop ends the supervisor and conhost with exit 0.
      function Child { Get-CimInstance Win32_Process -Filter "Name='clair.exe'" | Where-Object CommandLine -match '-listen=127\.0\.0\.1:7417' }
      $sup = Start-Process -FilePath "$env:SystemRoot\System32\conhost.exe" -ArgumentList '--headless', "`"$clair`"", 'daemon', '-supervise', '-listen', '127.0.0.1:7417', '-log-file', "`"$work\supervised.log`"" -PassThru
      Wait-Answering
      $first = (Child).ProcessId
      Check ($first) 'the supervisor started the daemon'
      Latest 'v0.0.6'
      $r = Clair update -releases $src
      Check ($r.Code -eq 0 -and $r.Out -match 'Installed clair v0\.0\.6') 'v0.0.6 staged under the supervisor'
      Stop-Process -Id $first -Force
      foreach ($i in 1..80) { $c = Child; if ($c -and $c.ProcessId -ne $first) { break }; Start-Sleep -Milliseconds 250 }
      Wait-Answering
      $st = (Clair status -json).Out | ConvertFrom-Json
      Check ($st.version -eq 'v0.0.6') 'the killed daemon came back, on the staged release'
      curl.exe -fsS -X POST -H "Authorization: Bearer $admin" http://127.0.0.1:7417/clair/ctl/stop
      Check ($sup.WaitForExit(20000)) 'a clean stop ended the supervisor and conhost'
      Check ($sup.ExitCode -eq 0) 'conhost exited 0'
      Check (-not (Child)) 'no daemon is left'
      Get-Content "$work\supervised.log" | Select-String 'starting it again|stopped cleanly'
      Stop-Process -Id $server.Id -Force
  after_script:
    # A process left running would hold files the next job's `git clean` must delete.
    - |
      $root = (Resolve-Path $env:CI_PROJECT_DIR).Path
      Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
      Get-Content "$root\self-update\daemon.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
